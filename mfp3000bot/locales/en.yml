# Main messages
unallowed_user: "👀 You don't have access to this Telegram bot. Contact the administrator to get access"
unallowed_thread: "👀 The administrator has forbidden using the bot in this thread"
hello: |
  👋 Welcome to the printing and scanning bot!

  To print a document, simply send a PDF or DOCX file to this chat.
      
  To scan a document, send the /scan command and follow the on-screen instructions.

  All commands are available through the "Menu" button at the bottom of the screen.

help: |
  🖨️ This bot is designed for quick access to our home printer via Telegram.

  To print a document, simply send a PDF or DOCX file to this chat.

  To scan a document, send the /scan command and follow the on-screen instructions.

