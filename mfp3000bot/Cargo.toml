[package]
name = "mfp3000bot"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0.98"
argh = "0.1.13"
base64 = "0.22.1"
bstr = { version = "1.12.0", features = ["serde"] }
iter-read = "1.1.0"
lazy_static = "1.5.0"
libcups = { path = "../libcups" }
libjpeg = { path = "../libjpeg" }
libsane = { path = "../libsane" }
log = "0.4.27"
once_cell = "1.21.3"
printpdf = { version = "0.8.2", default-features = false }
reqwest = { version = "0.12.22", features = ["blocking"] }
rust-i18n = "3.1.5"
serde = { version = "1.0.219", features = ["derive"] }
simple_logger = "5.0.0"
strum = { version = "0.27.2", features = ["derive"] }
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.47.0", features = ["full"] }
toml = "0.9.3"
